<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run &amp; Bike Trainer</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===========================================================
   Accueil — tout sur une page, lisible sans rien toucher.
   Vélo en signal orange, course en vert mousse, total en blanc :
   la couleur dit de quel sport on parle, sans relire le titre.
   =========================================================== */
.bloc { margin: 0 0 26px; }
.bloc-tete {
  display: flex; align-items: baseline; gap: 12px;
  padding: 0 0 10px; margin: 0 0 18px;
  border-bottom: 2px solid var(--accent);
}
.bloc-tete h2 {
  font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent);
}
.bloc-tete .compte { font-size: 12.5px; color: var(--ink-soft); margin-left: auto; text-align: right; line-height: 1.45; }

/* le chiffre qui porte le bloc : la distance */
.phare { display: flex; align-items: baseline; gap: 10px; margin: 0 0 20px; flex-wrap: wrap; }
.phare .n {
  font-family: 'DM Mono', monospace; font-weight: 500;
  font-size: clamp(52px, 15vw, 84px); line-height: 0.9;
  letter-spacing: -0.02em; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.phare .u { font-size: 19px; font-weight: 600; color: var(--ink-soft); }

.chiffres {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden;
}
@media (max-width: 720px) { .chiffres { grid-template-columns: repeat(2, 1fr); } }
/* min-width:0 est indispensable : une cellule de grille refuse par défaut de
   descendre sous la largeur de son contenu, et l'overflow:hidden de .chiffres
   coupe alors le chiffre au lieu de le laisser se réduire. */
.ch { background: var(--bg-card); padding: 14px 16px; min-width: 0; }
.ch .l {
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-label); margin: 0 0 7px;
}
.ch .v {
  font-family: 'DM Mono', monospace; font-size: clamp(18px, 5.4vw, 23px);
  font-weight: 500; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
@media (max-width: 380px) { .ch { padding: 12px 11px; } }
.ch .v .u { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 500; color: var(--ink-soft); white-space: nowrap; }
/* la fréquence cardiaque n'est relevée que sur une partie des sorties :
   on la distingue visuellement pour qu'on ne la lise pas comme le reste */
.ch.fc { background: var(--bg-raised); }
.ch.fc .l { color: var(--alert); }
.ch.vide { background: var(--bg-card); }
@media (max-width: 720px) { .ch.vide.large { display: none; } }
.bloc.total .ch.vide { background: var(--bg-raised); }
.note-grille { font-size: 12px; color: var(--ink-faint); margin: 9px 0 0; }

/* le total : même grammaire, mais c'est la somme, donc ça pèse plus lourd */
.bloc.total { margin-top: 34px; }
.bloc.total .bloc-tete { border-bottom-width: 3px; }
.bloc.total .chiffres { background: var(--line-bright); border-color: var(--line-bright); }
.bloc.total .ch { background: var(--bg-raised); padding: 18px 16px; }
.bloc.total .ch.fc { background: var(--bg-card); }
.bloc.total .ch .v { font-size: clamp(21px, 6.5vw, 29px); }
.periode { font-size: 12.5px; color: var(--ink-faint); margin: 12px 0 0; }

/* Deux teintes de plus que la feuille commune : le bleu de l'eau pour la
   natation, et un lilas pour ce qui n'est pas un sport (récupération, repos).
   Elles sont posées ici pour que la page reste le seul fichier à déposer.
   --ink-label : le gris des petits titres en capitales. Le gris d'origine
   (--ink-faint) ne faisait que 2,5:1 de contraste sur les cartes, illisible
   dehors sur un téléphone ; celui-ci monte à 9:1 et reste sous le blanc des
   chiffres. */
:root { --eau: #5aa9ff; --calme: #b9a7f0; --ink-label: #c3c9d0; }

/* l'objectif : les trois séances de la semaine, taillées sur ce qui a été fait */
.bloc.objectif { --accent: var(--amber); margin-bottom: 30px; }
.bloc.objectif .phare .u { max-width: 22em; line-height: 1.3; }
.seances { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 12px; }
@media (max-width: 720px) { .seances { grid-template-columns: 1fr; } }
.seance {
  background: var(--bg-card); border: 1px solid var(--line); border-top: 3px solid var(--accent-s);
  border-radius: var(--radius); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column;
}
.seance .sport { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-s); font-weight: 700; }
.seance .cible {
  font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500; line-height: 1.1;
  margin: 8px 0 8px; font-variant-numeric: tabular-nums;
}
.seance .cible .u { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--ink-soft); }
.seance .detail { font-size: 13.5px; line-height: 1.5; }
.seance .motif { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.45; flex: 1; }
.seance .etat {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.seance .etat .fait { color: var(--moss); }
.points { font-family: 'DM Mono', monospace; letter-spacing: 0.12em; color: var(--ink-faint); white-space: nowrap; }
.points b { color: var(--accent-s); font-weight: 500; }
.verdict {
  font-size: 13.5px; line-height: 1.5; margin: 0 0 16px; padding: 10px 14px;
  border-radius: var(--radius-sm); background: var(--bg-raised); border-left: 3px solid var(--moss);
}
.verdict.retard { border-left-color: var(--alert); }
.traj { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.traj .qui { white-space: nowrap; color: var(--ink); }
.traj .quand { font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--ink-soft); margin-left: 4px; }
.traj .d { margin-left: auto; text-align: right; color: var(--ink-soft); }
.traj.retard .d { color: var(--amber); }
.traj .d .ok { color: var(--moss); }
.traj .d .ko { color: var(--alert); }
.traj .d .partiel { color: var(--amber); }
@media (max-width: 520px) { .traj { flex-wrap: wrap; } .traj .d { margin-left: 0; text-align: left; flex-basis: 100%; } }
.conseils { margin: 14px 0 0; }
.conseils details { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-card); margin: 8px 0 0; }
.conseils summary {
  cursor: pointer; padding: 11px 14px; font-weight: 600; font-size: 14px;
  list-style: none; display: flex; align-items: center; gap: 10px;
}
.conseils summary::-webkit-details-marker { display: none; }
.conseils summary::after { content: '+'; margin-left: auto; color: var(--ink-faint); font-family: 'DM Mono', monospace; }
.conseils details[open] summary::after { content: '−'; }
.conseils .corps { padding: 0 14px 14px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; }
.conseils .corps p { margin: 0 0 8px; }
.conseils .corps ul { padding-left: 18px; margin: 6px 0 10px; }
.conseils .corps li { margin: 5px 0; }
.conseils .corps strong { color: var(--ink); font-weight: 600; }
.reglages { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; margin: 4px 0 0; }
@media (max-width: 520px) { .reglages { grid-template-columns: 1fr; } }
.reglages label {
  display: flex; flex-direction: column; gap: 5px; min-width: 0;
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-label);
}
.reglages input, .reglages select {
  font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: var(--ink); background: var(--bg-raised);
  border: 1px solid var(--line-bright); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; width: 100%;
}
.reglages input:focus-visible, .reglages select:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

/* le journal : trois questions après chaque séance, en boutons, pas en formulaire */
.journal { margin: 14px 0 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-card); }
.journal-titre { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-label); padding: 13px 16px 4px; }
.jentree { padding: 10px 16px 12px; border-top: 1px solid var(--line); }
.jentree:first-of-type { border-top: none; }
.jentree .qui { font-size: 13.5px; margin: 0 0 8px; }
.jentree .qui .quand { font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
.choix { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 6px 0; font-size: 12.5px; color: var(--ink-soft); }
.choix .l { min-width: 5.5em; }
.choix button {
  background: transparent; color: var(--ink-soft); border: 1px solid var(--line-bright);
  border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-family: inherit; cursor: pointer;
}
.choix button.on { background: var(--accent); color: #14171a; border-color: var(--accent); font-weight: 600; }
.choix input { font-family: inherit; font-size: 13px; color: var(--ink); background: var(--bg-raised); border: 1px solid var(--line-bright); border-radius: var(--radius-sm); padding: 5px 9px; width: 9em; min-width: 0; }
.choix input.large { width: 14em; }
.jentree .actions { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; font-size: 12.5px; color: var(--ink-soft); }
.jentree .bilan { font-size: 13px; color: var(--ink); }
.jentree .bilan .u { color: var(--ink-soft); }
.lien { background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font: inherit; font-size: 12.5px; padding: 0; }
.lien:hover { color: var(--ink); }
.lien.faible { color: var(--ink-faint); margin-left: auto; }
.lien.faible:hover { color: var(--alert); }
.confirme { margin-left: auto; font-size: 12.5px; color: var(--amber); }
.confirme .lien { color: var(--ink); margin: 0 2px; }
.jentree.ecartees { background: var(--bg-raised); font-size: 12.5px; color: var(--ink-soft); }
.ecartee { white-space: nowrap; }

/* la dernière sortie : un rappel, donc plus ramassé que les blocs de cumul */
.bloc.derniere { margin-bottom: 30px; }
.bloc.derniere .phare { margin-bottom: 6px; }
.bloc.derniere .phare .n { font-size: clamp(44px, 12vw, 64px); }
.nom-sortie { font-size: 14px; color: var(--ink-soft); margin: 0 0 16px; overflow-wrap: anywhere; }

/* la récupération : la seule partie de la page qui parle de demain, et qui
   ne dépend pas du filtre — elle passe donc au-dessus de lui */
.bloc.recup { --accent: var(--calme); margin-bottom: 30px; }
.bloc.recup .phare .u { max-width: 17em; line-height: 1.3; }
.ch.pret .v { color: var(--moss); }
.ch.attente .v .u { color: var(--accent); }

/* le repos : aucun des trois sports, donc la teinte « calme » */
.bloc.repos { --accent: var(--calme); margin-top: 34px; }
.bloc.repos .phare .u { max-width: 15em; line-height: 1.3; }
.ch.encours { background: var(--bg-raised); }
.ch.encours .l { color: var(--accent); }
.phases {
  margin: 16px 0 0; border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; background: var(--bg-card);
}
.phases-titre {
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-label); padding: 13px 16px 9px;
}
.phase {
  display: flex; align-items: baseline; gap: 12px;
  padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13.5px;
}
.phase .qui { min-width: 0; color: var(--ink); display: flex; flex-wrap: wrap; gap: 3px 0; }
.phase .cote { white-space: nowrap; }
/* en étroit les deux côtés ne tiennent pas toujours sur une ligne : on les
   empile partout plutôt que de laisser une ligne sur six faire exception */
@media (max-width: 520px) { .phase .cote { flex-basis: 100%; } .phase .fleche { margin-left: 0; } }
.phase .quand { font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
.phase .fleche { color: var(--ink-faint); margin: 0 9px; }
.phase .d {
  margin-left: auto; white-space: nowrap;
  font-family: 'DM Mono', monospace; font-weight: 500; font-variant-numeric: tabular-nums;
}
.phase .d .u { font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: var(--ink-soft); }
.pastille { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

/* choix de la période */
.filtre {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; margin: 0 0 22px;
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.filtre label {
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-label);
}
.filtre select {
  font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
  color: var(--ink); background: var(--bg-card);
  border: 1px solid var(--line-bright); border-radius: var(--radius-sm);
  padding: 8px 11px; cursor: pointer; min-width: 116px;
}
.filtre select:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.filtre .resume-periode { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }
.filtre .raz {
  background: none; border: 1px solid var(--line-bright); color: var(--ink-soft);
  font-size: 12px; padding: 7px 12px;
}

/* bandeau d'actualisation : les chiffres en cache s'affichent tout de suite,
   ce bandeau dit seulement qu'ils sont en train d'être rafraîchis */
.frais {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-soft);
  padding: 9px 14px; margin: 0 0 20px;
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.frais.pb { color: var(--amber); border-color: var(--signal-dim); }
.pouls {
  width: 7px; height: 7px; border-radius: 50%; background: var(--signal); flex: 0 0 7px;
  animation: pouls 1.3s ease-in-out infinite;
}
@keyframes pouls { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .pouls { animation: none; } }
.frais .maj { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 11.5px; color: var(--ink-faint); }
</style>
</head>
<body>

<div id="nav"></div>

<div class="relief-hero">
  <div id="relief-svg-container"></div>
  <div class="relief-content">
    <div class="relief-eyebrow">Run &amp; Bike Trainer</div>
    <div class="relief-title">Bord de piste</div>
    <div class="status-bar">
      <div class="dot off" id="statusDot"></div>
      <span id="statusText">Connexion…</span>
      <button class="btn-ghost" id="syncBtn" style="margin-left: auto;">Sync</button>
      <button class="btn-signal" id="connectBtn" style="display:none;">Se connecter à Strava</button>
    </div>
  </div>
</div>

<main>
  <div id="fraicheur"></div>
  <div id="recup"></div>
  <div id="plan"></div>
  <div id="filtre"></div>
  <div id="emptyState" class="empty-state" style="display:none;"></div>
  <div id="content"></div>
</main>

<script src="shared.js"></script>
<script>
document.getElementById('nav').outerHTML = RBT.renderNav();
document.getElementById('relief-svg-container').outerHTML = RBT.renderReliefSvg();

const els = {
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  syncBtn: document.getElementById('syncBtn'),
  connectBtn: document.getElementById('connectBtn'),
  emptyState: document.getElementById('emptyState'),
  content: document.getElementById('content'),
  fraicheur: document.getElementById('fraicheur'),
  filtre: document.getElementById('filtre'),
  recup: document.getElementById('recup'),
  plan: document.getElementById('plan'),
};

/* ===========================================================
   CACHE — le backend dort sur le free tier Render et met jusqu'à
   30 secondes à se réveiller. Sans cache, la page reste vide tout
   ce temps. On garde donc une projection légère des sorties (une
   dizaine de nombres chacune, pas les tracés GPS) : la page
   s'affiche instantanément ET le filtre par mois reste utilisable
   avant même que le serveur ait répondu.
   =========================================================== */
const CACHE_KEY = 'rbt_sorties_v2';   // v2 : distances natation brutes, corrigées à la lecture
function lireCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
}
function ecrireCache(o) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ...o, calcule: Date.now() })); } catch (e) {}
}

let BRUT = [];      // projection légère, telle que Strava la donne
let SORTIES = [];   // la même, distances natation corrigées : source de tous les calculs
let ATHLETE = null;

/* Ne garde d'une activité que ce que cette page affiche. Clés courtes :
   le tout doit tenir confortablement dans localStorage. */
function projette() {
  const exclue = (a) => RBT.state.excludedIds.includes(a.id);
  const un = (a, sport) => ({
    id: a.id,
    d: RBT.effectiveDate(a),
    s: sport,
    n: a.name || '',
    m: a.distance || 0,
    t: a.moving_time || 0,
    // durée écoulée, pauses comprises : c'est elle qui donne l'heure de fin
    // de la sortie, donc le début du repos qui suit
    e: a.elapsed_time || a.moving_time || 0,
    dp: a.total_elevation_gain || 0,
    vm: a.average_speed || 0,
    vx: a.max_speed || 0,
    fc: a.average_heartrate || 0,
    fx: a.max_heartrate || 0,
    cad: a.average_cadence || 0,
  });
  return [
    ...RBT.getRides().filter((a) => !exclue(a)).map((a) => un(a, 'velo')),
    ...RBT.getRuns().filter((a) => !exclue(a)).map((a) => un(a, 'course')),
    // la natation est filtrée ici plutôt que dans shared.js : un seul fichier à déposer
    ...RBT.state.activities.filter((a) => a.type === 'Swim' || a.sport_type === 'Swim')
      .filter((a) => !exclue(a)).map((a) => un(a, 'natation')),
  ];
}

// --- Mise en forme ---------------------------------------------------------
const nb = (n) => n.toLocaleString('fr-FR');
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
/* On arrondit AVANT de découper en heures/minutes : arrondir le reste
   séparément produit des « 62 h 60 » et des « 5'60" ». */
function heures(sec) {
  const min = Math.round(sec / 60);
  const h = Math.floor(min / 60), m = min % 60;
  return h ? (m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`) : `${m} min`;
}
/* Les trois sports de la page. « seance » : on parle de sortie à vélo et à
   pied, de séance dans l'eau. */
const SPORTS = {
  velo:     { nom: 'Vélo',          court: 'Vélo',     couleur: 'var(--signal)', la: 'ton vélo',    seance: 'sortie', duree: 'Temps en selle' },
  course:   { nom: 'Course à pied', court: 'Course',   couleur: 'var(--moss)',   la: 'ta course',   seance: 'sortie', duree: 'Temps de course' },
  natation: { nom: 'Natation',      court: 'Natation', couleur: 'var(--eau)',    la: 'ta natation', seance: 'séance', duree: 'Temps dans l\'eau' },
};

// En course on raisonne en allure (min/km), jamais en km/h ; dans l'eau, en min/100 m.
function allureDe(mps, metres = 1000) {
  if (!mps) return '—';
  const s = Math.round(metres / mps);
  return `${Math.floor(s / 60)}'${String(s % 60).padStart(2, '0')}"`;
}
function kmh(mps) { return mps ? (mps * 3.6).toFixed(1) : '—'; }
// Chaque sport dans son unité : km/h à vélo, min/km en course, min/100 m en natation.
function vit(mps, sport) {
  if (sport === 'course') return { v: allureDe(mps), u: '/km' };
  if (sport === 'natation') return { v: allureDe(mps, 100), u: '/100 m' };
  return { v: kmh(mps), u: 'km/h' };
}
// Une distance se lit en kilomètres sur terre, en mètres dans l'eau.
function dist(m, sport) {
  return sport === 'natation' ? { v: nb(Math.round(m)), u: 'm' } : { v: (m / 1000).toFixed(1), u: 'km' };
}

/* Additionne un lot de sorties. La vitesse moyenne est calculée sur les
   totaux, pas en moyennant les moyennes de chaque sortie : une sortie de
   5 km ne doit pas peser autant qu'une de 80 km.
   La fréquence cardiaque, elle, n'est relevée que sur une partie des
   sorties : on la moyenne uniquement sur celles qui en ont, et on compte
   combien c'en est. */
function cumule(lot) {
  const t = {
    n: lot.length, m: 0, sec: 0, dplus: 0,
    plusLongue: 0, plusHaute: 0, pointe: 0,
    rapide: 0, lente: Infinity,
    fcSomme: 0, fcPoids: 0, fcMax: 0, fcN: 0,
    derniere: null, premiere: null,
  };
  for (const a of lot) {
    t.m += a.m; t.sec += a.t; t.dplus += a.dp;
    if (a.m > t.plusLongue) t.plusLongue = a.m;
    if (a.dp > t.plusHaute) t.plusHaute = a.dp;
    if (a.vx > t.pointe) t.pointe = a.vx;
    if (a.vm > t.rapide) t.rapide = a.vm;
    if (a.vm && a.vm < t.lente) t.lente = a.vm;
    if (a.fc) { t.fcSomme += a.fc * a.t; t.fcPoids += a.t; t.fcN++; }
    if (a.fx > t.fcMax) t.fcMax = a.fx;
    if (!t.derniere || new Date(a.d) > new Date(t.derniere)) t.derniere = a.d;
    if (!t.premiere || new Date(a.d) < new Date(t.premiere)) t.premiere = a.d;
  }
  if (t.lente === Infinity) t.lente = 0;
  t.fcMoy = t.fcPoids ? t.fcSomme / t.fcPoids : 0;
  return t;
}

// --- Repos entre deux sorties ----------------------------------------------
/* Une phase de repos va de la fin d'une sortie au départ de la suivante.
   La fin, c'est le départ + la durée écoulée (pauses comprises) et non le
   temps en mouvement : un arrêt café fait partie de la sortie, pas du repos. */
const HEURE = 3600, JOUR = 86400;

/* Une date corrigée à la main peut ne porter aucune heure (« 2026-05-01 »).
   Lue telle quelle elle vaudrait minuit UTC ; on la place à midi, ce qui
   borne l'erreur à une demi-journée au lieu d'une journée entière. */
function debutMs(a) {
  return /^\d{4}-\d{2}-\d{2}$/.test(a.d) ? new Date(`${a.d}T12:00:00`).getTime() : new Date(a.d).getTime();
}
function finMs(a) { return debutMs(a) + (a.e || a.t || 0) * 1000; }

/* Pour chaque sortie d'un historique, le repos qui l'a précédée. On repart de
   la sortie qui a fini le plus tard, pas simplement de celle qui a démarré
   juste avant : deux enregistrements qui se chevauchent (doublon montre +
   compteur) donneraient sinon un repos qui commence au milieu d'une sortie.
   Un chevauchement vaut zéro repos, jamais un repos négatif. */
function phasesRepos(historique) {
  const tri = [...historique].sort((x, y) => debutMs(x) - debutMs(y));
  const phases = [];
  let avant = tri[0];
  for (let i = 1; i < tri.length; i++) {
    const apres = tri[i];
    phases.push({ avant, apres, sec: Math.max(0, (debutMs(apres) - finMs(avant)) / 1000) });
    if (finMs(apres) > finMs(avant)) avant = apres;
  }
  return phases;
}

function cumuleRepos(phases) {
  const r = { n: phases.length, moy: 0, mediane: 0, long: null, court: null, enchainees: 0, coupures: 0 };
  if (!r.n) return r;
  let somme = 0;
  for (const p of phases) {
    somme += p.sec;
    if (!r.long || p.sec > r.long.sec) r.long = p;
    if (!r.court || p.sec < r.court.sec) r.court = p;
    if (p.sec < JOUR) r.enchainees++;
    if (p.sec >= 7 * JOUR) r.coupures++;
  }
  r.moy = somme / r.n;
  const tri = phases.map((p) => p.sec).sort((x, y) => x - y);
  const m = Math.floor(r.n / 2);
  r.mediane = r.n % 2 ? tri[m] : (tri[m - 1] + tri[m]) / 2;
  return r;
}

/* Un repos se lit en heures tant qu'il est court, en jours au-delà : « 53 h »
   ne parle à personne, « 0.3 j » non plus. */
function dureeRepos(sec) {
  if (sec < HEURE) return { v: String(Math.round(sec / 60)), u: 'min', long: 'minutes' };
  if (sec < 2 * JOUR) return { v: String(Math.round(sec / HEURE)), u: 'h', long: 'heures' };
  return { v: (sec / JOUR).toFixed(1), u: 'j', long: 'jours' };
}

// --- Récupération conseillée -----------------------------------------------
/* Combien de temps laisser passer avant la prochaine sortie, d'après les
   dernières. Deux étages :

   1. La CHARGE d'une sortie = heures × intensité² × 100 (le principe du TSS :
      une heure à fond vaut 100 points). L'intensité est la vitesse de la
      sortie rapportée à ta vitesse « seuil », celle que tu tiendrais une
      heure à fond. Ce seuil n'est pas saisi : il est déduit de ta meilleure
      sortie des douze derniers mois, ramenée à une heure par la loi de
      Riegel (la vitesse tenable baisse d'environ 4 % quand la durée double).
      Le dénivelé est converti en plat équivalent.

   2. Le DÉLAI = charge × un nombre d'heures par point, qui dépend du sport
      qu'on vient de faire ET de celui qu'on veut faire : la course casse plus
      que le vélo (chocs), elle coûte donc plus cher ; la natation, portée et
      surtout tirée par les bras, se reprend le plus vite et gêne le moins
      les deux autres. Et un effort intense repousse surtout la prochaine
      séance dure, pas la prochaine sortie tranquille.

   Les constantes ci-dessous sont calées sur les repères d'entraîneur usuels :
   footing d'une heure -> 24 h ; 10 km à fond -> 2 jours avant de recourir,
   6 avant une séance dure ; semi à fond -> 4 jours et 12 jours ; marathon ->
   une semaine et trois semaines ; 2 h de vélo en endurance -> 24 h.
   C'est une estimation, pas une mesure : on ne connaît ni le sommeil, ni les
   douleurs, ni la fréquence cardiaque de repos. */
const RECUP = {
  riegel: 0.0566,                          // vitesse tenable ∝ durée^-0.0566
  platParMetreDplus: { course: 10, velo: 15, natation: 0 },   // 100 m de D+ = 1 km de plat à pied, 1,5 km à vélo
  /* Heures à attendre, par point de charge, avant une sortie tranquille.
     Ligne : le sport qu'on vient de faire. Colonne : celui qu'on veut faire. */
  heuresParPoint: {
    course:   { course: 0.45, velo: 0.225, natation: 0.15 },   // après une course, le vélo (sans chocs) revient deux fois plus vite
    velo:     { course: 0.24, velo: 0.24,  natation: 0.12 },
    natation: { course: 0.10, velo: 0.10,  natation: 0.20 },
  },
  intensiteFacile: 0.75,                   // en dessous, aucune pénalité pour la séance dure suivante
  penteIntense: { course: 2, velo: 1, natation: 1 },    // pénalité par tranche de 0,20 d'intensité au-dessus
  intensiteMin: 0.5, intensiteMax: 1.1,
  intensiteParDefaut: 0.75,                // sortie sans distance (saisie à la main, home-trainer)
  seuilSur: { course: { t: 1200, m: 3000 }, velo: { t: 1200, m: 10000 }, natation: { t: 600, m: 400 } },  // sorties assez longues pour juger
  memoire: 365 * JOUR,                     // le seuil se lit sur les douze derniers mois
  horizon: 45 * JOUR,                      // au-delà, une sortie ne pèse plus sur rien
};

function vitessePlat(a) { return a.t ? (a.m + RECUP.platParMetreDplus[a.s] * a.dp) / a.t : 0; }

/* Vitesse seuil au moment d'une sortie : la meilleure vitesse « ramenée à une
   heure » parmi les sorties du même sport des douze mois précédents, elle
   comprise. */
function vitesseSeuil(a) {
  const fin = debutMs(a), mini = RECUP.seuilSur[a.s];
  let best = 0;
  for (const b of SORTIES) {
    if (b.s !== a.s || b.t < mini.t || b.m < mini.m) continue;
    const quand = debutMs(b);
    if (quand > fin || quand < fin - RECUP.memoire * 1000) continue;
    const v = vitessePlat(b) * Math.pow(b.t / HEURE, RECUP.riegel);
    if (v > best) best = v;
  }
  return best;
}

function intensiteDe(a) {
  if (!a.m || !a.t) return RECUP.intensiteParDefaut;
  const seuil = vitesseSeuil(a);
  // aucune référence : on suppose la sortie courue à fond, c'est le côté prudent
  const brut = seuil ? vitessePlat(a) / seuil : Math.pow(a.t / HEURE, -RECUP.riegel);
  return Math.min(RECUP.intensiteMax, Math.max(RECUP.intensiteMin, brut));
}

/* Ce qu'une sortie impose : sa charge, et quatre échéances comptées depuis sa
   fin — une sortie tranquille dans chacun des trois sports, et la prochaine
   séance intense. */
function recupDe(a) {
  const intensite = intensiteDe(a);
  const charge = (a.t / HEURE) * intensite * intensite * 100;
  const h = RECUP.heuresParPoint[a.s];
  const surcote = Math.max(0, (intensite - RECUP.intensiteFacile) / 0.2);
  const fin = finMs(a);
  const apres = (heures) => fin + heures * charge * HEURE * 1000;
  return {
    sortie: a, intensite, charge,
    velo: apres(h.velo), course: apres(h.course), natation: apres(h.natation),
    intense: apres(h[a.s] * (1 + RECUP.penteIntense[a.s] * surcote)),
  };
}

/* La fatigue ne vient pas que de la dernière sortie : un vélo tranquille deux
   jours après un semi n'efface pas le semi. Chaque échéance est donc la plus
   tardive de celles qu'imposent les sorties récentes. */
function etatRecup(maintenant) {
  const recentes = SORTIES.filter((a) => a.t && finMs(a) <= maintenant && finMs(a) > maintenant - RECUP.horizon * 1000);
  if (!recentes.length) return null;
  const calculs = recentes.map(recupDe);
  const pire = (cle) => calculs.reduce((x, c) => (c[cle] > x[cle] ? c : x));
  const derniere = calculs.reduce((x, c) => (finMs(c.sortie) > finMs(x.sortie) ? c : x));
  return { derniere, velo: pire('velo'), course: pire('course'), natation: pire('natation'), intense: pire('intense') };
}

// --- Objectif 70.3 : plan progressif ----------------------------------------
/* Le plan n'est pas écrit à l'avance. Chaque semaine, l'objectif de chaque
   sport part du NIVEAU réel (la plus longue séance récente) et avance d'un
   PAS qui dépend de la RÉGULARITÉ des quatre dernières semaines : trois
   séances sur quatre, on progresse ; deux, à moitié ; une, on tient ; aucune,
   on reprend un cran en dessous. Une semaine sur quatre est allégée.
   La PHASE, comptée à rebours depuis l'épreuve, plafonne les volumes
   (fondation, développement, spécifique) puis les réduit (affûtage).
   Les BESOINS visés à l'entrée de l'affûtage laissent une marge sur l'épreuve
   elle-même : 1,9 km de natation, 90 km de vélo, 21,1 km de course. */
const PLAN_CLE = 'rbt_plan_v1';
const PLAN_DEFAUT = { epreuve: '2028-05-01', nom: '', dplus: 800, naissance: '', bassinFacteur: 0.5, bassinJusquau: '' };
let PLAN = { ...PLAN_DEFAUT };
function lirePlan() {
  try { PLAN = { ...PLAN_DEFAUT, ...(JSON.parse(localStorage.getItem(PLAN_CLE)) || {}) }; } catch (e) {}
}
function ecrirePlan() { try { localStorage.setItem(PLAN_CLE, JSON.stringify(PLAN)); } catch (e) {} }

/* Strava peut compter des longueurs de 50 m dans un bassin de 25 m : les
   distances nagées sont alors à diviser par deux, jusqu'à la date où la
   montre a été corrigée (vide : toutes). La correction se fait ici, sur la
   projection, pour que tout le reste de la page (natation, total, dernière
   séance, plan) voie des mètres justes. */
function corrige(brut) {
  const f = Number(PLAN.bassinFacteur) || 1;
  const limite = PLAN.bassinJusquau ? new Date(`${PLAN.bassinJusquau}T23:59:59`).getTime() : Infinity;
  return brut.map((a) => (a.s === 'natation' && f !== 1 && debutMs(a) <= limite)
    ? { ...a, m: a.m * f, vm: a.vm * f, vx: a.vx * f }
    : a);
}

/* Ce que le serveur garde pour le plan : réglages (les mêmes sur tous les
   appareils), objectifs figés chaque lundi, journal de séance. Tant que le
   serveur n'a pas répondu, on travaille avec les réglages du navigateur et
   rien n'est figé ni journalisé. */
let ENTRAINEMENT = { reglages: {}, semaines: {}, journal: {} };
let SERVEUR_OK = false;
let REGLAGES_NON_SAUVES = false;
const isoJour = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

async function chargerEntrainement() {
  try {
    const r = await fetch(`${API_BASE}/api/entrainement`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    ENTRAINEMENT = { reglages: {}, semaines: {}, journal: {}, ...d };
    if (Object.keys(ENTRAINEMENT.reglages).length) { PLAN = { ...PLAN_DEFAUT, ...ENTRAINEMENT.reglages }; ecrirePlan(); }
    SERVEUR_OK = true;
  } catch (e) {
    SERVEUR_OK = false;
  }
}
async function envoyer(methode, chemin, corps) {
  const r = await fetch(`${API_BASE}${chemin}`, { method: methode, headers: { 'Content-Type': 'application/json' }, body: corps ? JSON.stringify(corps) : undefined });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function sauverReglages() {
  ecrirePlan();
  if (!SERVEUR_OK) return;
  try {
    ENTRAINEMENT.reglages = await envoyer('PUT', '/api/entrainement/reglages', PLAN);
    REGLAGES_NON_SAUVES = false;
  } catch (e) {
    REGLAGES_NON_SAUVES = true;
  }
}

/* Les objectifs de la semaine se figent à la première visite de la semaine,
   calculés comme au lundi matin (sans les séances déjà faites depuis). Si la
   date d'épreuve change en cours de semaine, on refige. */
let FIGE_EN_COURS = false;
let FIGE_TENTE = '';   // « semaine|épreuve » déjà tentée : un échec ne se rejoue pas à chaque rendu
async function figerSemaine(ctx) {
  if (!SERVEUR_OK || !ctx || ctx.passe || FIGE_EN_COURS) return;
  const cle = isoJour(ctx.lundi), fig = ENTRAINEMENT.semaines[cle];
  if (fig && fig.epreuve === PLAN.epreuve) return;
  if (FIGE_TENTE === `${cle}|${PLAN.epreuve}`) return;
  FIGE_TENTE = `${cle}|${PLAN.epreuve}`;
  FIGE_EN_COURS = true;
  try {
    const auLundi = { ...ctx, maintenant: ctx.lundi + 1 };
    const cibles = {};
    for (const s of ['natation', 'velo', 'course']) {
      const c = cibleSport(s, auLundi, true);
      cibles[s] = { cible: c.cible, dp: c.dp, motif: c.motif, niveau: c.niv ? Math.round(c.niv.m) : null };
    }
    const r = await envoyer('PUT', `/api/entrainement/semaines/${cle}${fig ? '?force=1' : ''}`, { epreuve: PLAN.epreuve, phase: ctx.phase.cle, allegee: ctx.allegee, cibles });
    if (!r || !r.semaine || !r.semaine.cibles) throw new Error('réponse inattendue');
    ENTRAINEMENT.semaines[cle] = r.semaine;
    FIGE_EN_COURS = false;
    rendPlan();
  } catch (e) { /* la semaine reste non figée pour cette visite */ }
  FIGE_EN_COURS = false;
}

// Journal : ce qu'on a dit d'une séance, et ce que ça change.
function journalDe(a) { return a.id != null ? ENTRAINEMENT.journal[String(a.id)] : null; }
function journalRecents(maintenant, jours = 14) {
  return SORTIES.filter((a) => journalDe(a) && finMs(a) > maintenant - jours * JOUR * 1000)
    .sort((x, y) => finMs(y) - finMs(x)).map((a) => ({ a, j: journalDe(a) }));
}
function fatigueJournal(maintenant) {
  const r = journalRecents(maintenant).slice(0, 2);
  return r.length === 2 && r.every((x) => x.j.jambes === 'lourdes');
}
function douleurJournal(sport, maintenant) {
  const r = journalRecents(maintenant).find((x) => x.a.s === sport);
  return r && r.j.douleur ? r.j.douleur : null;
}

const BESOIN = { natation: 2200, velo: 95000, course: 19000 };   // en mètres, à l'entrée de l'affûtage
const PAS = {
  natation: { pct: 0.15, min: 50,   max: 300,   depart: 200,   arrondi: 25 },
  velo:     { pct: 0.08, min: 5000, max: 12000, depart: 30000, arrondi: 5000 },
  course:   { pct: 0.08, min: 1000, max: 2000,  depart: 5000,  arrondi: 500 },
};
const PHASES = [
  { jusqua: 1,        cle: 'epreuve',       nom: 'Semaine de course', frac: { natation: 0.4, velo: 0.35, course: 0.3 }, dp: 0.3 },
  { jusqua: 3,        cle: 'affutage',      nom: 'Affûtage',          frac: { natation: 0.7, velo: 0.6, course: 0.55 }, dp: 0.5 },
  { jusqua: 11,       cle: 'specifique',    nom: 'Spécifique',        plafond: 1,    dp: 1.1 },
  { jusqua: 23,       cle: 'developpement', nom: 'Développement',     plafond: 0.9,  dp: 0.85 },
  { jusqua: Infinity, cle: 'fondation',     nom: 'Fondation',         plafond: 0.8,  dp: 0.5 },
];
const SEMAINE = 7 * JOUR * 1000;

function debutSemaine(ms) {
  const d = new Date(ms);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // lundi
  return d.getTime();
}

function contextePlan(maintenant) {
  const ep = new Date(`${PLAN.epreuve}T08:00:00`).getTime();
  if (isNaN(ep)) return null;
  const lundi = debutSemaine(maintenant);
  const semaines = Math.ceil((ep - lundi) / SEMAINE);   // semaines avant l'épreuve, celle-ci comprise
  const phase = PHASES.find((p) => semaines <= p.jusqua);
  const allegee = !phase.frac && semaines % 4 === 0;
  const age = PLAN.naissance ? new Date(maintenant).getFullYear() - Number(PLAN.naissance) : null;
  return { maintenant, ep, lundi, semaines, phase, allegee, age, passe: semaines < 1, fatigue: fatigueJournal(maintenant) };
}

/* Niveau : la plus longue séance des 3 dernières semaines (4 à vélo, qu'on ne
   fait pas chaque semaine), bornée à 1,3 fois la médiane des séances de la
   fenêtre : une course exceptionnelle (un semi au milieu de sorties de 10 km)
   ne doit pas devenir le point de départ de la semaine suivante. Plus loin
   dans le temps, on décote : ce qu'on savait faire il y a deux mois n'est plus
   tout à fait acquis. */
function niveau(sport, maintenant) {
  const fen = sport === 'velo' ? 28 : 21;
  const dans = (jours) => SORTIES.filter((a) => a.s === sport && a.m && debutMs(a) <= maintenant && debutMs(a) > maintenant - jours * JOUR * 1000);
  let lot = dans(fen), coef = 1;
  if (!lot.length) { lot = dans(fen * 2); coef = 0.9; }
  if (!lot.length) { lot = dans(90); coef = 0.75; }
  if (!lot.length) return null;
  const best = lot.reduce((x, a) => (a.m > x.m ? a : x));
  let m = best.m;
  if (lot.length >= 2) {
    const tri = lot.map((a) => a.m).sort((x, y) => x - y);
    m = Math.min(m, 1.3 * tri[Math.floor((tri.length - 1) / 2)]);   // médiane basse
  }
  return { m: m * coef, dp: (best.dp || 0) * coef, quand: best.d, estime: coef < 1 };
}

// Les quatre dernières semaines pleines (la semaine en cours n'est pas finie).
function regularite(sport, ctx) {
  const semaines = [4, 3, 2, 1].map((k) =>
    SORTIES.some((a) => a.s === sport && debutMs(a) >= ctx.lundi - k * SEMAINE && debutMs(a) < ctx.lundi - (k - 1) * SEMAINE));
  return { semaines, n: semaines.filter(Boolean).length };
}
function faitSemaine(sport, ctx) {
  const l = SORTIES.filter((a) => a.s === sport && debutMs(a) >= ctx.lundi && debutMs(a) <= ctx.maintenant);
  return l.length ? l.reduce((x, a) => (a.m > x.m ? a : x)) : null;
}
const arrondiA = (m, pas) => Math.round(m / pas) * pas;

/* Combien de semaines pour atteindre le besoin au rythme actuel, et est-ce
   avant l'affûtage. Simulation semaine par semaine, pas réduit selon la
   régularité, semaine allégée sans progrès. */
function trajectoire(sport, niv, reg, ctx) {
  const p = PAS[sport], besoin = BESOIN[sport];
  let m = niv ? niv.m : p.depart;
  if (m >= besoin) return { atteint: true };
  const mult = reg.n >= 3 ? 1 : reg.n === 2 ? 0.5 : 0.25;
  let n = 0;
  while (m < besoin && n < 300) { n++; if (n % 4 !== 0) m += Math.min(p.max, Math.max(p.min, m * p.pct)) * mult; }
  const dispo = ctx.semaines - 3;
  return { atteint: false, semaines: n, dispo, marge: dispo - n, quand: ctx.lundi + n * SEMAINE };
}

function allureFacile(maintenant) {
  const v = SORTIES.filter((a) => a.s === 'course' && a.m >= 3000 && a.vm && debutMs(a) > maintenant - 42 * JOUR * 1000)
    .map((a) => a.vm).sort((x, y) => x - y);
  if (!v.length) return null;
  const med = v[Math.floor(v.length / 2)];
  return allureDe(med / 1.12);   // 12 % plus lent que l'allure courante
}

// La meilleure séance d'un sport entre deux instants.
function meilleureEntre(sport, de, a) {
  const l = SORTIES.filter((x) => x.s === sport && debutMs(x) >= de && debutMs(x) < a);
  return l.length ? l.reduce((x, y) => (y.m > x.m ? y : x)) : null;
}
// L'objectif figé de la semaine précédente, et s'il a été tenu (90 % suffisent).
function semaineDerniere(sport, ctx) {
  const fig = ENTRAINEMENT.semaines[isoJour(ctx.lundi - SEMAINE)];
  const c = fig && fig.cibles && fig.cibles[sport];
  if (!c || !c.cible) return null;
  const fait = meilleureEntre(sport, ctx.lundi - SEMAINE, ctx.lundi);
  return { cible: c.cible, fait, tenu: !!fait && fait.m >= c.cible * 0.9 };
}

/* calculSeul : on veut le calcul du lundi, sans reprendre ce qui a été figé.
   Sinon, une semaine déjà figée garde ses objectifs quoi qu'il arrive dans la
   semaine ; seuls « fait », la régularité et la trajectoire restent vivants. */
function cibleSport(sport, ctx, calculSeul = false) {
  const p = PAS[sport], niv = niveau(sport, ctx.maintenant), reg = regularite(sport, ctx);
  const besoin = BESOIN[sport], base = niv ? niv.m : p.depart;
  const pas = Math.min(p.max, Math.max(p.min, base * p.pct));
  const derniere = semaineDerniere(sport, ctx);
  const douleur = douleurJournal(sport, ctx.maintenant);
  let cible, motif;
  if (ctx.phase.frac) {
    cible = besoin * ctx.phase.frac[sport]; motif = 'affutage';
  } else if (!niv) {
    cible = p.depart; motif = 'depart';
  } else if (reg.n === 0) {
    cible = Math.max(p.depart, base * 0.85); motif = 'reprise';
  } else if (reg.n === 1) {
    cible = base; motif = 'tenir';
  } else if (douleur) {
    cible = Math.min(base, derniere ? derniere.cible : base); motif = 'douleur';
  } else if (derniere && !derniere.tenu) {
    cible = derniere.cible; motif = 'manque';
  } else {
    const plafond = Math.max(base, besoin * ctx.phase.plafond);
    const voulu = base + pas * (reg.n === 2 ? 0.5 : 1);
    cible = Math.min(plafond, voulu);
    motif = voulu > plafond ? 'plafond' : 'progresser';
  }
  const motifs = [motif];
  if (!ctx.phase.frac) {
    if (ctx.fatigue) { cible *= 0.85; motifs.push('fatigue'); }
    if (ctx.allegee) { cible *= 0.7; motifs.push('allegee'); }
  }
  motif = motifs.join('+');
  cible = Math.max(p.arrondi, arrondiA(cible, p.arrondi));
  let dp = 0;
  if (sport === 'velo') {
    dp = Math.min(Number(PLAN.dplus) * ctx.phase.dp, (niv ? niv.dp : 0) + 100);
    if (ctx.allegee || ctx.fatigue) dp *= 0.7;
    dp = Math.max(0, arrondiA(dp, 50));
  }
  let fige = false;
  const fig = !calculSeul && ENTRAINEMENT.semaines[isoJour(ctx.lundi)];
  if (fig && fig.epreuve === PLAN.epreuve && fig.cibles && fig.cibles[sport] && fig.cibles[sport].cible) {
    cible = fig.cibles[sport].cible; dp = fig.cibles[sport].dp || 0; motif = fig.cibles[sport].motif || motif; fige = true;
  }
  return {
    sport, niv, reg, cible, dp, motif, pas, fige, derniere, douleur,
    fait: faitSemaine(sport, ctx),
    traj: trajectoire(sport, niv, reg, ctx),
    allureFacile: sport === 'course' ? allureFacile(ctx.maintenant) : null,
  };
}

function distPlan(m, sport) { const d = dist(m, sport); return `${d.v} ${d.u}`; }

function seanceTexte(c, ctx) {
  const ph = ctx.phase.cle, m = c.cible, km = (m / 1000).toFixed(m % 1000 ? 1 : 0);
  if (c.sport === 'natation') {
    if (ph === 'epreuve') return { titre: 'Déblocage', detail: `${m} m très souples, avec quelques accélérations de 25 m. Si l'épreuve est en eau libre, va repérer le parcours.` };
    if (ph === 'affutage') return { titre: 'Entretien', detail: `${m} m en séries de 100 m à l'allure prévue pour l'épreuve, 20 s de récupération.` };
    if (m <= 600) return { titre: 'Technique', detail: `${m} m en tout, par séries de 25 ou 50 m avec 20 à 30 s de récupération au mur. Une série sur trois en éducatif (planche jambes, bras seuls avec pull-buoy). L'objectif de la séance, c'est la distance totale, pas la vitesse.` };
    if (m <= 1200) return { titre: 'Technique et endurance', detail: `${m} m : 200 m d'échauffement, puis des séries de 100 m avec 20 s de récupération, 100 m souples pour finir. Cherche à allonger ce que tu nages sans t'arrêter.` };
    if (ph === 'specifique') return { titre: 'Continu', detail: `${m} m dont un bloc de ${arrondiA(m * 0.6, 100)} m sans t'arrêter à allure d'épreuve. Dès que possible, une séance sur deux en eau libre, en combinaison si l'épreuve l'autorise.` };
    return { titre: 'Endurance', detail: `${m} m : 300 m d'échauffement, un bloc de ${arrondiA(m * 0.5, 100)} m sans t'arrêter, puis des 100 m à allure soutenue, 100 m souples.` };
  }
  if (c.sport === 'velo') {
    const d = `${km} km, ${c.dp} m de D+`;
    if (ph === 'epreuve') return { titre: 'Déblocage', detail: `${d} tranquille, avec trois accélérations d'une minute. Vérifie le vélo : freins, pneus, transmission.` };
    if (ph === 'affutage') return { titre: 'Entretien', detail: `${d} en endurance, avec 2 × 10 min à l'allure prévue pour l'épreuve.` };
    if (ph === 'specifique') return { titre: 'Sortie longue + enchaînement', detail: `${d}, dont 30 à 40 min à l'allure visée pour l'épreuve. Enchaîne tout de suite 15 à 20 min de course à pied à allure facile : c'est la transition que le corps doit apprendre.` };
    if (ph === 'developpement') return { titre: 'Sortie longue vallonnée', detail: `${d} en endurance (tu peux parler), cadence 85 à 95. Choisis un parcours avec des bosses : le D+ de l'épreuve se prépare ici, pas la vitesse sur le plat.` };
    return { titre: 'Sortie endurance', detail: `${d} en endurance, cadence 85 à 95 tours par minute. Mange toutes les 30 à 40 min dès que la sortie dépasse 1 h 30.` };
  }
  const d = `${km} km`, al = c.allureFacile ? ` à allure facile (≈ ${c.allureFacile}/km)` : ' à allure facile';
  if (ph === 'epreuve') return { titre: 'Déblocage', detail: `${d}${al}, avec 4 ou 5 lignes droites de 20 s un peu plus vite. Rien de plus.` };
  if (ph === 'affutage') return { titre: 'Entretien', detail: `${d}${al}, dont 10 min à l'allure prévue pour l'épreuve.` };
  if (ph === 'specifique') return { titre: 'Sortie longue', detail: `${d}${al}. Une semaine sur deux, remplace par 8 × 2 min à allure 10 km, 1 min de trot entre. L'enchaînement vélo → course se fait après la sortie vélo.` };
  if (ph === 'developpement') return { titre: 'Sortie longue', detail: `${d}${al}, les 2 derniers kilomètres un peu plus vite. Travaille la cadence : 170 à 180 pas par minute.` };
  return { titre: 'Sortie longue', detail: `${d}${al}. L'objectif est de courir plus longtemps, pas plus vite : si tu ne peux plus parler, ralentis.` };
}

function motifTexte(c) {
  const t = String(c.motif || '').split('+').map((m) => motifUn(c, m)).filter(Boolean);
  return t.join(' ; ');
}
function motifUn(c, motif) {
  const niv = c.niv ? distPlan(c.niv.m, c.sport) : '';
  const est = c.niv && c.niv.estime ? ' (estimée : rien de récent)' : '';
  switch (motif) {
    case 'progresser': return `+${distPlan(c.pas * (c.reg.n === 2 ? 0.5 : 1), c.sport)} sur ta meilleure séance récente, ${niv}${est}`;
    case 'plafond': return `volume suffisant pour cette phase : la priorité, c'est la régularité et la qualité`;
    case 'tenir': return `une seule séance en quatre semaines : on tient le niveau (${niv}) avant d'avancer`;
    case 'reprise': return `aucune séance en quatre semaines : on reprend un cran sous ton niveau (${niv})`;
    case 'depart': return `aucune séance connue : on démarre doucement`;
    case 'allegee': return `semaine allégée : 30 % de moins pour assimiler`;
    case 'manque': return `objectif de la semaine dernière${c.derniere ? ` (${distPlan(c.derniere.cible, c.sport)})` : ''} non atteint : on le remet, sans l'augmenter`;
    case 'douleur': return `douleur signalée (${RBT.escapeHtml(c.douleur || '')}) : pas de progression tant qu'elle est là`;
    case 'fatigue': return `deux séances « jambes lourdes » d'affilée : on lève le pied, 15 % de moins`;
    case 'affutage': return `on réduit le volume, pas l'intensité : les jambes doivent arriver fraîches`;
  }
  return '';
}

const SEANCE_JOUR = (a) => new Date(debutMs(a)).toLocaleDateString('fr-FR', { weekday: 'long' });

function carteSeance(c, ctx) {
  const sp = SPORTS[c.sport], t = seanceTexte(c, ctx), d = dist(c.cible, c.sport);
  const points = c.reg.semaines.map((ok) => (ok ? '<b>●</b>' : '○')).join('');
  let etat;
  if (c.fait) {
    const ok = c.fait.m >= c.cible * 0.9;
    etat = `<span class="fait">${ok ? '✓ fait' : '~ en partie'} ${SEANCE_JOUR(c.fait)} : ${distPlan(c.fait.m, c.sport)}</span>`;
  } else {
    etat = '<span>à faire cette semaine</span>';
  }
  return `<div class="seance" style="--accent-s:${sp.couleur}">
    <div class="sport">${sp.nom} · ${t.titre}</div>
    <div class="cible">${d.v} <span class="u">${d.u}</span></div>
    <div class="detail">${t.detail}</div>
    <div class="motif">${motifTexte(c)}</div>
    <div class="etat">${etat}<span class="points" title="séances des 4 dernières semaines">${points}</span></div>
  </div>`;
}

function ligneTrajectoire(c, ctx) {
  const sp = SPORTS[c.sport], t = c.traj;
  const niv = c.niv ? distPlan(c.niv.m, c.sport) : '—';
  let texte, ok = true;
  if (t.atteint) texte = `niveau de préparation atteint, on entretient`;
  else if (t.marge >= 0) texte = `à ce rythme, ${distPlan(BESOIN[c.sport], c.sport)} vers ${new Date(t.quand).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })} — ${t.marge} semaine${t.marge > 1 ? 's' : ''} de marge`;
  else { ok = false; texte = `à ce rythme, ${distPlan(BESOIN[c.sport], c.sport)} seulement vers ${new Date(t.quand).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })} — ${-t.marge} semaine${-t.marge > 1 ? 's' : ''} de retard`; }
  return `<div class="traj${ok ? '' : ' retard'}">
    <span class="qui"><span class="pastille" style="background:${sp.couleur}"></span>${sp.court} <span class="quand">${niv}</span></span>
    <span class="d">${texte}</span>
  </div>`;
}

/* Les semaines figées passées : prévu contre réalisé, sport par sport. */
function historiqueSemaines(ctx) {
  const cles = Object.keys(ENTRAINEMENT.semaines).filter((k) => k < isoJour(ctx.lundi)).sort().reverse().slice(0, 6);
  if (!cles.length) return '';
  const lignes = cles.map((k) => {
    const fig = ENTRAINEMENT.semaines[k], lundi = new Date(`${k}T00:00:00`).getTime();
    const parts = ['natation', 'velo', 'course'].map((s) => {
      const c = fig.cibles && fig.cibles[s]; if (!c || !c.cible) return '';
      const fait = meilleureEntre(s, lundi, lundi + SEMAINE);
      const cls = !fait ? 'ko' : fait.m >= c.cible * 0.9 ? 'ok' : 'partiel';
      const sym = cls === 'ok' ? '✓' : cls === 'partiel' ? '~' : '✗';
      return `<span class="${cls}">${SPORTS[s].court} ${distPlan(c.cible, s)} → ${fait ? distPlan(fait.m, s) : '—'} ${sym}</span>`;
    }).filter(Boolean).join(' · ');
    const tenus = ['natation', 'velo', 'course'].filter((s) => { const c = fig.cibles && fig.cibles[s]; const f = c && c.cible && meilleureEntre(s, lundi, lundi + SEMAINE); return f && f.m >= c.cible * 0.9; }).length;
    return `<div class="traj${tenus < 2 ? ' retard' : ''}">
      <span class="qui">Semaine du <span class="quand">${RBT.fmtDate(k)}</span>${fig.allegee ? ' <span class="quand">allégée</span>' : ''}</span>
      <span class="d">${parts}</span>
    </div>`;
  }).join('');
  return `<div class="phases"><div class="phases-titre">Semaines passées — prévu → réalisé</div>${lignes}</div>`;
}

function verdict(cibles, ctx) {
  const retard = cibles.filter((c) => !c.traj.atteint && c.traj.marge < 0);
  if (ctx.phase.frac) return { ok: true, texte: `Plus rien à construire : l'affûtage sert à arriver reposé. Dors, mange normalement, ne rattrape rien.` };
  if (!retard.length) return { ok: true, texte: `Dans les temps sur les trois sports. Une séance de chaque par semaine suffit ; la régularité compte plus que la distance.` };
  const noms = retard.map((c) => SPORTS[c.sport].nom.toLowerCase());
  const conseil = retard.map((c) => c.reg.n <= 2
    ? `en ${SPORTS[c.sport].nom.toLowerCase()}, ne saute plus de semaine`
    : `en ${SPORTS[c.sport].nom.toLowerCase()}, ajoute une deuxième séance une semaine sur deux`).join(' ; ');
  return { ok: false, texte: `En retard en ${noms.join(' et ')} : ${conseil}. Le calcul se refait chaque semaine, le retard se rattrape.` };
}

function zonesFc(ctx) {
  if (!ctx.age) return `<p><strong>Zones cardiaques</strong> : renseigne ton année de naissance dans les réglages pour les obtenir.</p>`;
  const max = Math.round(208 - 0.7 * ctx.age), z = (a, b) => `${Math.round(max * a)}–${Math.round(max * b)} bpm`;
  return `<p><strong>Zones cardiaques</strong> (FC max estimée ${max}, formule 208 − 0,7 × âge, à ajuster si ta montre a déjà vu plus haut) : endurance ${z(0.6, 0.7)}, c'est là que se passent 80 % des séances ; tempo ${z(0.7, 0.8)} ; seuil ${z(0.8, 0.9)}, réservé aux fractionnés.</p>`;
}

function conseils(cibles, ctx) {
  const par = (s) => cibles.find((c) => c.sport === s);
  const der = (s, f) => SORTIES.filter((a) => a.s === s && f(a) && debutMs(a) > ctx.maintenant - 90 * JOUR * 1000)
    .reduce((x, a) => (!x || debutMs(a) > debutMs(x) ? a : x), null);
  // cadence course : Strava la donne par jambe (85 = 170 pas/min)
  const rc = der('course', (a) => a.cad), cadC = rc ? Math.round(rc.cad < 120 ? rc.cad * 2 : rc.cad) : null;
  const rv = der('velo', (a) => a.cad), cadV = rv ? Math.round(rv.cad) : null;
  const n = par('natation'), nivN = n.niv ? n.niv.m : 0;
  const dn = der('natation', (a) => a.vm), allN = dn ? allureDe(dn.vm, 100) : null;

  const natation = `
    <p>${nivN < 800
      ? `Tu en es à ${nivN ? Math.round(nivN) + ' m' : 'tes premières séances'} par séance${allN ? `, autour de ${allN} aux 100 m` : ''} : la priorité absolue est la <strong>technique</strong>, pas la distance. Un crawl économe fait gagner plus de mètres que n'importe quel entraînement.`
      : `Tu nages ${Math.round(nivN)} m par séance${allN ? `, autour de ${allN} aux 100 m` : ''} : la base est là, on allonge les blocs nagés sans s'arrêter et on soigne la technique à chaque échauffement.`}</p>
    <ul>
      <li><strong>Respiration</strong> : expire en continu dans l'eau, par le nez et la bouche ; l'inspiration est courte, la tête tourne avec l'épaule, une seule lunette sort de l'eau. Respire tous les deux temps pour commencer, puis tous les trois (des deux côtés) quand c'est à l'aise. C'est presque toujours la respiration qui bloque le débutant, pas les bras.</li>
      <li><strong>Position</strong> : regard vers le fond, nuque dans l'axe, hanches hautes. Les battements sont petits, depuis la hanche, pieds souples — ils servent à l'équilibre, pas à avancer.</li>
      <li><strong>Traction</strong> : la main entre dans l'eau devant l'épaule, s'allonge, puis le coude reste haut pendant que l'avant-bras pousse l'eau jusqu'à la cuisse. Compte tes mouvements par longueur de 25 m : vise 20 ou moins, c'est le meilleur indicateur de progrès.</li>
      <li><strong>Éducatifs</strong> (une série sur trois) : planche avec battements, bras seuls avec pull-buoy, « rattrapé » (une main attend l'autre devant), un bras à la fois.</li>
      <li><strong>Eau libre</strong> : à partir de l'été 2027, nage en lac ou en combinaison ; apprends à relever la tête tous les 6 à 8 mouvements pour te repérer, et à partir au milieu d'un groupe.</li>
    </ul>`;

  const velo = `
    <p>Tu tiens 90 km sur le plat : la distance de l'épreuve est acquise. Ce qui manque, c'est le <strong>dénivelé</strong> (${PLAN.dplus} m prévus sur le parcours, contre 400 au plus aujourd'hui) et l'habitude de <strong>courir après</strong>.</p>
    <ul>
      <li><strong>Cadence</strong> : 85 à 95 tours par minute${cadV ? ` (dernière sortie mesurée : ${cadV})` : ''}. Mouliner fatigue moins les jambes pour la course qui suit ; dans les bosses, reste assis, passe un pignon plus facile plutôt que de forcer.</li>
      <li><strong>D+</strong> : une sortie sur deux sur un parcours vallonné, en augmentant de 100 m de D+ par semaine environ. L'objectif n'est pas de monter vite mais de monter longtemps sans se mettre dans le rouge.</li>
      <li><strong>Position</strong> : fais régler ta hauteur de selle ; dès la phase de développement, des prolongateurs (clip-on) sur le cintre valent 1 à 2 km/h gratuits sur 90 km, à condition de s'y entraîner.</li>
      <li><strong>Manger et boire</strong> : 60 g de glucides et 500 ml par heure dès que la sortie dépasse 1 h 30, en commençant à la première demi-heure. On teste tout à l'entraînement, jamais le jour J.</li>
      <li><strong>Enchaînements</strong> : en phase spécifique, 15 à 20 min de course à pied tout de suite après la sortie vélo. Les premières fois les jambes sont en bois pendant 10 min, c'est normal, ça s'apprend.</li>
    </ul>`;

  const course = `
    <p>Tu cours 10 km à 6'40"/km et tu as déjà fait un semi : le 21,1 km du 70.3 se court après 90 km de vélo, donc ${par('course').allureFacile ? `à une allure plus proche de ton allure facile (${par('course').allureFacile}/km)` : 'plus lentement que ton 10 km'}, et c'est très bien. Le travail porte sur l'<strong>économie</strong> de la foulée et le <strong>volume</strong>, pas sur la vitesse.</p>
    <ul>
      <li><strong>Cadence</strong> : 170 à 180 pas par minute${cadC ? ` (dernière sortie mesurée : ${cadC})` : ''}. Des pas plus courts et plus fréquents, c'est moins de freinage à chaque appui et moins de blessures. Monte de 5 % à la fois, sur une sortie facile, avec un métronome ou une playlist au bon tempo.</li>
      <li><strong>Foulée</strong> : le pied se pose sous le bassin, pas devant, à plat ou sur l'avant ; le buste légèrement penché depuis les chevilles, pas depuis la taille ; les bras balancent d'avant en arrière, coudes à 90°, sans croiser devant.</li>
      <li><strong>Allures</strong> : la sortie longue se court en pouvant parler ; une séance sur quatre peut devenir un fractionné court (8 × 2 min à allure 10 km) à partir de la phase de développement. Deux séances dures par semaine n'apportent rien de plus à ce stade.</li>
      <li><strong>Renforcement</strong> : 10 min deux fois par semaine — mollets sur une marche, fentes, pont fessier, gainage. C'est ce qui permet d'encaisser l'augmentation de volume.</li>
      <li><strong>Progression</strong> : +8 % par semaine sur la sortie longue, jamais plus de 2 km d'un coup, et une semaine allégée sur quatre, c'est ce que le plan applique.</li>
    </ul>`;

  return [
    { id: 'natation', titre: 'Conseils natation', corps: natation },
    { id: 'velo', titre: 'Conseils vélo', corps: velo },
    { id: 'course', titre: 'Conseils course à pied', corps: course + zonesFc(ctx) },
  ];
}

// Les panneaux dépliés restent dépliés d'un rendu à l'autre.
const OUVERTS = new Set();

function formReglages() {
  const v = (x) => RBT.escapeHtml(x == null ? '' : x);
  return `<div class="reglages">
    <label>Date de l'épreuve<input type="date" id="plEpreuve" value="${v(PLAN.epreuve)}"></label>
    <label>Nom de l'épreuve<input type="text" id="plNom" value="${v(PLAN.nom)}" placeholder="70.3 Luxembourg, Tours, Nice…"></label>
    <label>D+ du parcours vélo (m)<input type="number" id="plDplus" value="${v(PLAN.dplus)}" step="50" min="0"></label>
    <label>Année de naissance<input type="number" id="plNaissance" value="${v(PLAN.naissance)}" min="1940" max="2015" placeholder="pour les zones cardiaques"></label>
    <label>Distances natation Strava<select id="plBassin">
      <option value="0.5"${Number(PLAN.bassinFacteur) === 0.5 ? ' selected' : ''}>à diviser par 2 (bassin de 25 m compté en 50 m)</option>
      <option value="1"${Number(PLAN.bassinFacteur) === 1 ? ' selected' : ''}>justes</option>
    </select></label>
    <label>Correction natation jusqu'au (vide : toutes les séances)<input type="date" id="plJusquau" value="${v(PLAN.bassinJusquau)}"></label>
  </div>
  <p class="note-grille">${REGLAGES_NON_SAUVES ? 'Le serveur n\'a pas enregistré les derniers réglages : ils ne valent que dans ce navigateur pour l\'instant.' : SERVEUR_OK ? 'Réglages enregistrés sur le serveur : les mêmes sur le téléphone et le PC.' : 'Serveur injoignable : réglages gardés dans ce navigateur en attendant.'}</p>`;
}

function rendPlan() {
  const ctx = contextePlan(Date.now());
  const tete = (compte) => `<div class="bloc-tete"><h2>Objectif 70.3</h2><div class="compte">${compte}</div></div>`;
  const panneau = (id, titre, corps) => `<details data-panneau="${id}"${OUVERTS.has(id) ? ' open' : ''}><summary>${titre}</summary><div class="corps">${corps}</div></details>`;
  const reglages = panneau('reglages', 'Réglages de l\'objectif', formReglages());
  let html;
  if (!ctx) {
    html = `<section class="bloc objectif">${tete('')}<p style="color:var(--ink-soft);font-size:14px">Renseigne une date d'épreuve pour obtenir un plan.</p><div class="conseils">${reglages}</div></section>`;
  } else if (ctx.passe) {
    html = `<section class="bloc objectif">${tete(`${RBT.escapeHtml(PLAN.nom) || 'Épreuve'} · ${RBT.fmtDateLong(PLAN.epreuve)}`)}<p style="color:var(--ink-soft);font-size:14px">L'épreuve est passée. Mets une nouvelle date dans les réglages pour relancer un plan.</p><div class="conseils">${reglages}</div></section>`;
  } else {
    const cibles = ['natation', 'velo', 'course'].map((s) => cibleSport(s, ctx));
    const v = verdict(cibles, ctx);
    const dateEp = RBT.fmtDateLong(PLAN.epreuve);
    html = `<section class="bloc objectif">
      ${tete(`${RBT.escapeHtml(PLAN.nom) || 'Ironman 70.3'} · ${dateEp}<br>phase ${ctx.phase.nom.toLowerCase()}${ctx.allegee ? ' · semaine allégée' : ''}`)}
      <div class="phare"><span class="n">${ctx.semaines}</span><span class="u">semaine${ctx.semaines > 1 ? 's' : ''} avant l'épreuve — cette semaine, voici tes trois séances</span></div>
      <div class="seances">${cibles.map((c) => carteSeance(c, ctx)).join('')}</div>
      <div class="verdict${v.ok ? '' : ' retard'}">${v.texte}</div>
      <div class="phases">
        <div class="phases-titre">Trajectoire — niveau actuel et date d'arrivée au besoin</div>
        ${cibles.map((c) => ligneTrajectoire(c, ctx)).join('')}
      </div>
      ${historiqueSemaines(ctx)}
      <p class="note-grille">Besoin à l'entrée de l'affûtage (3 semaines avant) : 2 200 m nagés d'une traite, 95 km de vélo avec le D+ du parcours, 19 km de course. Les objectifs se figent le lundi${SERVEUR_OK ? '' : ' (dès que le serveur répond)'} ; un objectif manqué est remis la semaine suivante, une semaine sautée baisse le niveau, le journal de séance (jambes lourdes, douleur) retient le plan.</p>
      <div class="conseils">
        ${conseils(cibles, ctx).map((p) => panneau(p.id, p.titre, p.corps)).join('')}
        ${reglages}
      </div>
    </section>`;
  }
  els.plan.innerHTML = html;
  figerSemaine(ctx);

  els.plan.querySelectorAll('details[data-panneau]').forEach((d) => {
    d.addEventListener('toggle', () => { if (d.open) OUVERTS.add(d.dataset.panneau); else OUVERTS.delete(d.dataset.panneau); });
  });
  const lire = () => {
    PLAN.epreuve = document.getElementById('plEpreuve').value || PLAN_DEFAUT.epreuve;
    PLAN.nom = document.getElementById('plNom').value.trim();
    PLAN.dplus = Number(document.getElementById('plDplus').value) || 0;
    PLAN.naissance = document.getElementById('plNaissance').value;
    PLAN.bassinFacteur = Number(document.getElementById('plBassin').value) || 1;
    PLAN.bassinJusquau = document.getElementById('plJusquau').value;
    SORTIES = corrige(BRUT);
    sauverReglages().then(tout);
    tout();
  };
  ['plEpreuve', 'plNom', 'plDplus', 'plNaissance', 'plBassin', 'plJusquau'].forEach((id) => {
    document.getElementById(id).addEventListener('change', lire);
  });
}

// --- Filtre période --------------------------------------------------------
const periode = { annee: '', mois: '' };   // '' = tout

function dansPeriode(a) {
  const d = new Date(a.d);
  if (periode.annee && String(d.getFullYear()) !== periode.annee) return false;
  if (periode.mois !== '' && d.getMonth() !== Number(periode.mois)) return false;
  return true;
}
function filtre(lot) { return lot.filter(dansPeriode); }
function libellePeriode() {
  if (!periode.annee && periode.mois === '') return 'Depuis le début';
  if (periode.annee && periode.mois === '') return `Année ${periode.annee}`;
  if (!periode.annee) return `Tous les mois de ${MOIS[Number(periode.mois)]}`;
  return `${MOIS[Number(periode.mois)]} ${periode.annee}`;
}

function rendFiltre() {
  const annees = [...new Set(SORTIES.map((a) => new Date(a.d).getFullYear()))].sort((x, y) => y - x);
  // On ne propose que les mois qui contiennent réellement des sorties :
  // un menu qui offre des mois vides fait croire à une perte de données.
  const dispo = new Set(
    SORTIES.filter((a) => !periode.annee || String(new Date(a.d).getFullYear()) === periode.annee)
      .map((a) => new Date(a.d).getMonth())
  );
  const moisOpts = MOIS.map((nom, i) =>
    dispo.has(i) ? `<option value="${i}"${String(i) === periode.mois ? ' selected' : ''}>${nom}</option>` : ''
  ).join('');

  els.filtre.innerHTML = `
    <div class="filtre">
      <label for="selAnnee">Année</label>
      <select id="selAnnee">
        <option value="">Toutes</option>
        ${annees.map((a) => `<option value="${a}"${String(a) === periode.annee ? ' selected' : ''}>${a}</option>`).join('')}
      </select>
      <label for="selMois">Mois</label>
      <select id="selMois">
        <option value="">Tous</option>
        ${moisOpts}
      </select>
      ${(periode.annee || periode.mois !== '') ? '<button class="raz" id="razBtn">Tout voir</button>' : ''}
      <span class="resume-periode">${libellePeriode()}</span>
    </div>`;

  document.getElementById('selAnnee').onchange = (e) => {
    periode.annee = e.target.value;
    // si le mois choisi n'existe pas dans la nouvelle année, on le relâche
    const dispo2 = new Set(SORTIES.filter((a) => !periode.annee || String(new Date(a.d).getFullYear()) === periode.annee)
      .map((a) => new Date(a.d).getMonth()));
    if (periode.mois !== '' && !dispo2.has(Number(periode.mois))) periode.mois = '';
    tout();
  };
  document.getElementById('selMois').onchange = (e) => { periode.mois = e.target.value; tout(); };
  const raz = document.getElementById('razBtn');
  if (raz) raz.onclick = () => { periode.annee = ''; periode.mois = ''; tout(); };
}

// --- Rendu -----------------------------------------------------------------
/* La grille fait 4 colonnes en large et 2 en etroit. Une liste dont la taille
   n'est pas un multiple de 4 laisse des trous qui se lisent comme des
   cellules cassees : on complete la derniere rangee. */
function grille(cells) {
  const c = cells.filter(Boolean);
  // une cellule pour completer la 2e colonne : utile a toutes les largeurs
  if (c.length % 2 !== 0) c.push('<div class="ch vide"></div>');
  // celles qui completent la 4e colonne n'ont de sens qu'en large :
  // en 2 colonnes elles ajouteraient une rangee entierement vide
  while (c.length % 4 !== 0) c.push('<div class="ch vide large"></div>');
  return `<div class="chiffres">${c.join('')}</div>`;
}
function cellule(label, valeur, unite, classe) {
  return `<div class="ch${classe ? ' ' + classe : ''}"><div class="l">${label}</div>
    <div class="v">${valeur}${unite ? ` <span class="u">${unite}</span>` : ''}</div></div>`;
}

function blocSport(sport, t) {
  const sp = SPORTS[sport], eau = sport === 'natation';
  const pluriel = (n) => `${n} ${sp.seance}${n > 1 ? 's' : ''}`;
  if (!t.n) {
    return `<section class="bloc" style="--accent:${sp.couleur}">
      <div class="bloc-tete"><h2>${sp.nom}</h2></div>
      <p style="color:var(--ink-soft);font-size:14px">Aucune ${sp.seance} sur cette période.</p>
    </section>`;
  }
  const moy = vit(t.m / (t.sec || 1), sport);
  const pointe = vit(t.pointe, sport);
  const rapide = vit(t.rapide, sport);
  const lente = vit(t.lente, sport);
  const moyenne = dist(t.m / t.n, sport), longue = dist(t.plusLongue, sport);
  const S = sp.seance.charAt(0).toUpperCase() + sp.seance.slice(1);
  /* Dans l'eau il n'y a ni dénivelé ni pointe de vitesse qui tienne (le
     GPS d'un bassin n'en donne pas de fiable) : la grille est plus courte. */
  const cells = eau ? [
    cellule(sp.duree, heures(t.sec), ''),
    cellule('Allure moyenne', moy.v, moy.u),
    cellule(`${S} moyenne`, moyenne.v, moyenne.u),
    cellule(`Plus longue ${sp.seance}`, longue.v, longue.u),
    cellule(`${S} la plus rapide`, rapide.v, rapide.u),
    cellule(`${S} la plus lente`, lente.v, lente.u),
  ] : [
    cellule('Dénivelé positif', nb(Math.round(t.dplus)), 'm'),
    cellule(sp.duree, heures(t.sec), ''),
    cellule(sport === 'course' ? 'Allure moyenne' : 'Vitesse moyenne', moy.v, moy.u),
    cellule(`${S} moyenne`, moyenne.v, moyenne.u),
    cellule('Pointe maximale', pointe.v, pointe.u),
    cellule(`${S} la plus rapide`, rapide.v, rapide.u),
    cellule(`${S} la plus lente`, lente.v, lente.u),
    cellule(`Plus longue ${sp.seance}`, longue.v, longue.u),
    cellule('Plus gros dénivelé', nb(Math.round(t.plusHaute)), 'm'),
    cellule('D+ par kilomètre', t.m ? Math.round(t.dplus / (t.m / 1000)) : '—', 'm/km'),
  ];
  return `<section class="bloc" style="--accent:${sp.couleur}">
    <div class="bloc-tete">
      <h2>${sp.nom}</h2>
      <div class="compte">${pluriel(t.n)}<br>dernière le ${RBT.fmtDate(t.derniere)}</div>
    </div>
    <div class="phare">${eau
      ? `<span class="n">${nb(Math.round(t.m))}</span><span class="u">m nagés</span>`
      : `<span class="n">${nb(Math.round(t.m / 1000))}</span><span class="u">km parcourus</span>`}</div>
    ${grille([
      ...cells,
      t.fcN ? cellule('FC moyenne', Math.round(t.fcMoy), 'bpm', 'fc') : '',
      t.fcN ? cellule('FC maximale', t.fcMax, 'bpm', 'fc') : '',
    ])}
    ${t.fcN
      ? `<p class="note-grille">Fréquence cardiaque relevée sur ${pluriel(t.fcN)} sur ${t.n} — la moyenne ne porte que sur celles-là.</p>`
      : `<p class="note-grille">Aucune ${sp.seance} de cette période ne porte de fréquence cardiaque — elle apparaîtra ici dès qu'une ${sp.seance} en rapportera.</p>`}
  </section>`;
}

/* Le repos se mesure sur l'historique entier, puis on garde les phases qui
   précèdent une sortie de la période. Calculer sur le lot filtré donnerait,
   avec « tous les mois de mars », un repos de onze mois entre le dernier mars
   et le suivant — un trou du filtre, pas un repos. */
function reposPeriode(historique) {
  return phasesRepos(historique).filter((p) => dansPeriode(p.apres));
}

function ligneCote(a) {
  const sp = SPORTS[a.s];
  return `<span class="pastille" style="background:${sp.couleur}"></span>${sp.court} <span class="quand">${RBT.fmtDate(a.d)}</span>`;
}

function blocRepos() {
  const tete = (compte) => `<div class="bloc-tete"><h2>Repos</h2>${compte ? `<div class="compte">${compte}</div>` : ''}</div>`;
  const phases = reposPeriode(SORTIES);
  if (!phases.length) {
    return `<section class="bloc repos">${tete('')}
      <p style="color:var(--ink-soft);font-size:14px">Il faut au moins deux sorties pour mesurer un repos — aucune phase sur cette période.</p>
    </section>`;
  }
  const r = cumuleRepos(phases);
  const parSport = (sport) => cumuleRepos(reposPeriode(SORTIES.filter((a) => a.s === sport)));
  const velo = parSport('velo'), course = parSport('course'), natation = parSport('natation');
  /* En tête, le repos habituel (la médiane) et non la moyenne : une seule
     coupure d'hiver suffit à tirer la moyenne loin de ce qu'on fait vraiment
     d'une semaine sur l'autre. La moyenne reste affichée juste en dessous. */
  const habituel = dureeRepos(r.mediane);
  const cell = (label, sec, classe) => { const d = dureeRepos(sec); return cellule(label, d.v, d.u, classe); };

  // Le repos en cours n'a de sens que si la période va jusqu'à la dernière sortie connue.
  const derniere = SORTIES.reduce((x, a) => (!x || finMs(a) > finMs(x) ? a : x), null);
  const enCours = derniere && dansPeriode(derniere) ? Math.max(0, (Date.now() - finMs(derniere)) / 1000) : null;

  const recentes = [...phases].sort((x, y) => debutMs(y.apres) - debutMs(x.apres)).slice(0, 6);

  return `<section class="bloc repos">
    ${tete(`${nb(r.n)} phase${r.n > 1 ? 's' : ''} de repos<br>tous sports confondus`)}
    <div class="phare"><span class="n">${habituel.v}</span><span class="u">${habituel.long} de repos, le plus souvent, entre deux sorties</span></div>
    ${grille([
      cell('Repos moyen', r.moy),
      cell('Plus long repos', r.long.sec),
      cell('Plus court repos', r.court.sec),
      enCours !== null ? cell('Repos en cours', enCours, 'encours') : '',
      velo.n ? cell('Habituel entre deux vélos', velo.mediane) : '',
      course.n ? cell('Habituel entre deux courses', course.mediane) : '',
      natation.n ? cell('Habituel entre deux natations', natation.mediane) : '',
      cellule('Sorties enchaînées', nb(r.enchainees), 'moins de 24 h'),
      cellule('Coupures', nb(r.coupures), '7 jours et plus'),
    ])}
    <p class="note-grille">Un repos va de la fin d'une sortie (pauses comprises) au départ de la suivante. « Habituel » est la médiane : la moitié des repos sont plus courts, l'autre moitié plus longs. Plus long repos : du ${RBT.fmtDate(r.long.avant.d)} au ${RBT.fmtDate(r.long.apres.d)}.</p>
    <div class="phases">
      <div class="phases-titre">Dernières phases de repos</div>
      ${recentes.map((p) => { const d = dureeRepos(p.sec); return `<div class="phase">
        <span class="qui"><span class="cote">${ligneCote(p.avant)}</span><span class="cote"><span class="fleche">→</span>${ligneCote(p.apres)}</span></span>
        <span class="d">${d.v} <span class="u">${d.u}</span></span>
      </div>`; }).join('')}
    </div>
  </section>`;
}

function nomSortie(a) {
  return `${SPORTS[a.s].la} du ${RBT.fmtDate(a.d)}`;
}
function resumeSortie(a) {
  const d = dist(a.m, a.s);
  return `${d.v} ${d.u} en ${heures(a.t)}`;
}

/* Rappel de la dernière sortie, tout en haut : c'est d'elle qu'on part pour
   lire la récupération juste en dessous. Elle s'affiche même si elle est
   ancienne — c'est alors l'information « tu n'es pas sorti depuis… ». */
function blocDerniere(maintenant) {
  const a = SORTIES.reduce((x, b) => (!x || finMs(b) > finMs(x) ? b : x), null);
  if (!a) return '';
  const sp = SPORTS[a.s], quand = new Date(debutMs(a));
  const date = quand.toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long',
    ...(quand.getFullYear() !== new Date(maintenant).getFullYear() ? { year: 'numeric' } : {}),
  });
  const depuis = dureeRepos(Math.max(0, (maintenant - finMs(a)) / 1000));
  const d = dist(a.m, a.s), v = vit(a.vm || (a.t ? a.m / a.t : 0), a.s);
  const r = recupDe(a);
  const ou = { velo: 'à vélo', course: 'à pied', natation: 'nagés' }[a.s];
  return `<section class="bloc derniere" style="--accent:${sp.couleur}">
    <div class="bloc-tete">
      <h2>Dernière ${sp.seance}</h2>
      <div class="compte">${date}<br>il y a ${depuis.v} ${depuis.u}</div>
    </div>
    <div class="phare"><span class="n">${d.v}</span><span class="u">${d.u} ${ou}</span></div>
    ${a.n ? `<p class="nom-sortie">${RBT.escapeHtml(a.n)}</p>` : ''}
    ${grille([
      cellule(sp.duree, heures(a.t), ''),
      cellule(a.s === 'velo' ? 'Vitesse moyenne' : 'Allure moyenne', v.v, v.u),
      a.s !== 'natation' ? cellule('Dénivelé positif', nb(Math.round(a.dp)), 'm') : '',
      a.fc ? cellule('FC moyenne', Math.round(a.fc), 'bpm', 'fc') : '',
      cellule('Effort', Math.round(r.intensite * 100), '% de ton seuil'),
      cellule('Charge', Math.round(r.charge), 'points'),
    ])}
    <p class="note-grille">Effort : ta vitesse rapportée à celle que tu tiendrais une heure à fond. Charge : durée × effort², 100 points valent une heure à fond.</p>
    ${blocJournal(maintenant)}
  </section>`;
}

/* Le journal : les séances des dix derniers jours, renseignées ou non (une
   entrée se modifie). Trois questions en boutons, une quatrième dans l'eau. */
const JOURNAL_OUVERT = new Set();   // entrées qu'on est en train de modifier
function blocJournal(maintenant) {
  if (!SERVEUR_OK) return `<div class="journal"><div class="journal-titre">Journal de séance</div><div class="jentree"><span style="font-size:13px;color:var(--ink-soft)">Disponible dès que le serveur répond.</span></div></div>`;
  const recentes = SORTIES.filter((a) => a.id != null && finMs(a) <= maintenant && finMs(a) > maintenant - 10 * JOUR * 1000)
    .sort((x, y) => finMs(y) - finMs(x));
  const aMontrer = recentes.slice(0, 4);
  const entree = (a) => {
    const id = String(a.id), j = journalDe(a), sp = SPORTS[a.s];
    const qui = `<div class="qui"><span class="pastille" style="background:${sp.couleur}"></span>${sp.court} <span class="quand">${RBT.fmtDate(a.d)} · ${distPlan(a.m, a.s)}</span></div>`;
    if (j && !JOURNAL_OUVERT.has(id)) {
      const ress = { 1: 'bien', 2: 'moyen', 3: 'dur' }[j.ressenti] || '';
      return `<div class="jentree">${qui}<div class="actions"><span class="bilan">✓ ${ress}${j.jambes ? ` · jambes ${j.jambes}` : ''}${j.douleur ? ` · douleur : ${RBT.escapeHtml(j.douleur)}` : ''}${j.mouvements ? ` · ${j.mouvements} <span class="u">mvts / 25 m</span>` : ''}</span><button class="lien" data-jmodif="${id}">modifier</button>${ecarter(id)}</div></div>`;
    }
    const v = j || {};
    const b = (champ, val, lib) => `<button type="button" data-champ="${champ}" data-val="${val}"${String(v[champ]) === String(val) ? ' class="on"' : ''}>${lib}</button>`;
    return `<div class="jentree" data-jid="${id}">${qui}
      <div class="choix"><span class="l">Ressenti</span>${b('ressenti', 1, 'Bien')}${b('ressenti', 2, 'Moyen')}${b('ressenti', 3, 'Dur')}</div>
      <div class="choix"><span class="l">Jambes</span>${b('jambes', 'fraîches', 'Fraîches')}${b('jambes', 'lourdes', 'Lourdes')}</div>
      <div class="choix"><span class="l">Douleur</span><input type="text" data-champ="douleur" class="large" placeholder="rien, ou où ?" value="${RBT.escapeHtml(v.douleur || '')}"></div>
      ${a.s === 'natation' ? `<div class="choix"><span class="l">Mouvements</span><input type="number" data-champ="mouvements" min="5" max="60" placeholder="par 25 m" value="${v.mouvements || ''}"></div>` : ''}
      <div class="actions"><button class="btn-signal btn-small" data-jsauve="${id}">Enregistrer</button>${j ? `<button class="lien" data-jannule="${id}">annuler</button>` : ''}${ecarter(id)}</div>
    </div>`;
  };
  // Les séances écartées des trente derniers jours, pour pouvoir les rétablir.
  const ecartees = RBT.state.activities
    .filter((a) => RBT.state.excludedIds.includes(a.id) && new Date(RBT.effectiveDate(a)).getTime() > maintenant - 30 * JOUR * 1000)
    .sort((x, y) => new Date(RBT.effectiveDate(y)) - new Date(RBT.effectiveDate(x)));
  const sportDe = (a) => (a.type === 'Run' || a.sport_type === 'Run') ? 'course' : (a.type === 'Swim' || a.sport_type === 'Swim') ? 'natation' : 'velo';
  const retablir = ecartees.length ? `<div class="jentree ecartees"><div class="qui" style="margin:0">Écartées : ${ecartees.map((a) => `<span class="ecartee">${SPORTS[sportDe(a)].court} <span class="quand">${RBT.fmtDate(RBT.effectiveDate(a))} · ${distPlan((a.distance || 0) * (sportDe(a) === 'natation' ? (Number(PLAN.bassinFacteur) || 1) : 1), sportDe(a))}</span> <button class="lien" data-jretablir="${a.id}">rétablir</button></span>`).join(' · ')}</div></div>` : '';
  if (!aMontrer.length && !retablir) return '';
  return `<div class="journal"><div class="journal-titre">Journal de séance — comment c'était ?</div>${aMontrer.map(entree).join('')}${retablir}</div>`;
}
/* Écarter une séance (mauvais enregistrement, doublon montre + compteur,
   compteur resté allumé) : elle sort de tous les calculs, pas de Strava.
   Deux clics pour éviter la fausse manœuvre. */
function ecarter(id) {
  return JOURNAL_ECART === id
    ? `<span class="confirme">écarter cette séance de tous les calculs ? <button class="lien" data-jecarte-oui="${id}">oui</button> <button class="lien" data-jecarte-non="${id}">non</button></span>`
    : `<button class="lien faible" data-jecarte="${id}" title="mauvais enregistrement, doublon…">écarter</button>`;
}
let JOURNAL_ECART = null;
async function reprojeter() {
  BRUT = projette();
  SORTIES = corrige(BRUT);
  ecrireCache({ sorties: BRUT, athlete: ATHLETE });
  tout();
}
function brancherEcart() {
  els.recup.querySelectorAll('[data-jecarte]').forEach((b) => b.addEventListener('click', () => { JOURNAL_ECART = b.dataset.jecarte; tout(); }));
  els.recup.querySelectorAll('[data-jecarte-non]').forEach((b) => b.addEventListener('click', () => { JOURNAL_ECART = null; tout(); }));
  els.recup.querySelectorAll('[data-jecarte-oui]').forEach((b) => b.addEventListener('click', async () => {
