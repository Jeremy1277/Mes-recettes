    const id = Number(b.dataset.jecarteOui);
    b.disabled = true; b.textContent = '…';
    try { await RBT.toggleExclude(id, true); JOURNAL_ECART = null; JOURNAL_OUVERT.delete(String(id)); reprojeter(); }
    catch (e) { b.disabled = false; b.textContent = 'réessayer'; }
  }));
  els.recup.querySelectorAll('[data-jretablir]').forEach((b) => b.addEventListener('click', async () => {
    const id = Number(b.dataset.jretablir);
    b.disabled = true; b.textContent = '…';
    try { await RBT.toggleExclude(id, false); reprojeter(); }
    catch (e) { b.disabled = false; b.textContent = 'réessayer'; }
  }));
}

function brancherJournal() {
  els.recup.querySelectorAll('.jentree[data-jid]').forEach((bloc) => {
    bloc.querySelectorAll('.choix button').forEach((btn) => btn.addEventListener('click', () => {
      bloc.querySelectorAll(`.choix button[data-champ="${btn.dataset.champ}"]`).forEach((x) => x.classList.toggle('on', x === btn && !btn.classList.contains('on')));
    }));
  });
  els.recup.querySelectorAll('[data-jsauve]').forEach((btn) => btn.addEventListener('click', async () => {
    const id = btn.dataset.jsauve, bloc = btn.closest('.jentree');
    const entree = {};
    bloc.querySelectorAll('.choix button.on').forEach((x) => { entree[x.dataset.champ] = x.dataset.champ === 'ressenti' ? Number(x.dataset.val) : x.dataset.val; });
    bloc.querySelectorAll('.choix input').forEach((x) => { const val = x.value.trim(); if (val) entree[x.dataset.champ] = x.type === 'number' ? Number(val) : val; });
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    try {
      const r = await envoyer('PUT', `/api/entrainement/journal/${id}`, entree);
      ENTRAINEMENT.journal[id] = r.entree;
      JOURNAL_OUVERT.delete(id);
      tout();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Réessayer';
    }
  }));
  els.recup.querySelectorAll('[data-jmodif]').forEach((btn) => btn.addEventListener('click', () => { JOURNAL_OUVERT.add(btn.dataset.jmodif); tout(); }));
  brancherEcart();
  els.recup.querySelectorAll('[data-jannule]').forEach((btn) => btn.addEventListener('click', () => { JOURNAL_OUVERT.delete(btn.dataset.jannule); tout(); }));
}

function rendRecup() {
  const maintenant = Date.now();
  const derniere = blocDerniere(maintenant);
  const e = etatRecup(maintenant);
  if (!e) { els.recup.innerHTML = derniere; brancherJournal(); return; }

  const jour = (ms) => new Date(ms).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const echeance = (label, c, cle) => {
    const reste = (c[cle] - maintenant) / 1000;
    if (reste <= 0) return cellule(label, 'Possible', `depuis ${jour(c[cle])}`, 'pret');
    const d = dureeRepos(reste);
    return cellule(label, jour(c[cle]), `dans ${d.v} ${d.u}`, 'attente');
  };

  // Le chiffre en tête répond à la question qu'on se pose en ouvrant la page :
  // est-ce que je peux y retourner, et sinon dans combien de temps.
  const resteCourse = (e.course.course - maintenant) / 1000;
  const resteVelo = (e.velo.velo - maintenant) / 1000;
  const resteNatation = (e.natation.natation - maintenant) / 1000;
  const resteIntense = (e.intense.intense - maintenant) / 1000;
  let phare;
  if (resteCourse > 0) {
    const d = dureeRepos(resteCourse);
    phare = `<span class="n">${d.v}</span><span class="u">${d.long} avant de recourir tranquillement${resteVelo <= 0 ? ' — le vélo, lui, est déjà possible' : ''}</span>`;
  } else if (resteVelo > 0) {
    const d = dureeRepos(resteVelo);
    phare = `<span class="n">${d.v}</span><span class="u">${d.long} avant de remonter sur le vélo — la course tranquille est déjà possible</span>`;
  } else if (resteNatation > 0) {
    const d = dureeRepos(resteNatation);
    phare = `<span class="n">${d.v}</span><span class="u">${d.long} avant de retourner nager — vélo et course tranquilles sont déjà possibles</span>`;
  } else if (resteIntense > 0) {
    const d = dureeRepos(resteIntense);
    phare = `<span class="n" style="color:var(--moss)">Prêt</span><span class="u">pour une sortie tranquille — encore ${d.v} ${d.u} avant une séance intense</span>`;
  } else {
    phare = `<span class="n" style="color:var(--moss)">Prêt</span><span class="u">pour n'importe quelle séance, dans les trois sports</span>`;
  }

  const a = e.derniere.sortie;
  // quand ce n'est pas la dernière sortie qui retarde la séance intense, on dit laquelle
  const frein = e.intense.sortie !== a && resteIntense > 0
    ? ` La séance intense reste retardée par ${nomSortie(e.intense.sortie)} (${resumeSortie(e.intense.sortie)}).`
    : '';

  els.recup.innerHTML = derniere + `<section class="bloc recup">
    <div class="bloc-tete">
      <h2>Récupération</h2>
      <div class="compte">avant la prochaine sortie<br>d'après tes 45 derniers jours</div>
    </div>
    <div class="phare">${phare}</div>
    ${grille([
      echeance('Vélo tranquille', e.velo, 'velo'),
      echeance('Course tranquille', e.course, 'course'),
      echeance('Natation tranquille', e.natation, 'natation'),
      echeance('Séance intense ou longue', e.intense, 'intense'),
    ])}
    <p class="note-grille">Estimation tirée de la durée et de l'intensité de tes sorties des 45 derniers jours.${frein} Des jambes lourdes ou une douleur passent avant ce calendrier.</p>
  </section>`;
  brancherJournal();
}

function rendu() {
  const lot = filtre(SORTIES);
  const velo = cumule(lot.filter((a) => a.s === 'velo'));
  const course = cumule(lot.filter((a) => a.s === 'course'));
  const natation = cumule(lot.filter((a) => a.s === 'natation'));
  const tout_ = cumule(lot);

  els.content.innerHTML =
    blocSport('velo', velo) +
    blocSport('course', course) +
    blocSport('natation', natation) +
    `<section class="bloc total" style="--accent:var(--ink)">
      <div class="bloc-tete">
        <h2>Total</h2>
        <div class="compte">vélo + course à pied + natation<br>${libellePeriode().toLowerCase()}</div>
      </div>
      <div class="phare"><span class="n" style="color:var(--ink)">${nb(Math.round(tout_.m / 1000))}</span><span class="u">km au compteur</span></div>
      ${grille([
        cellule('Sorties', nb(tout_.n), ''),
        cellule('Dénivelé positif', nb(Math.round(tout_.dplus)), 'm'),
        cellule('Temps total', heures(tout_.sec), ''),
        cellule('Vitesse moyenne', kmh(tout_.m / (tout_.sec || 1)), 'km/h'),
        cellule('Pointe maximale', kmh(tout_.pointe), 'km/h'),
        cellule('Plus longue sortie', (tout_.plusLongue / 1000).toFixed(1), 'km'),
        tout_.fcN ? cellule('FC moyenne', Math.round(tout_.fcMoy), 'bpm', 'fc') : '',
        tout_.fcN ? cellule('FC maximale', tout_.fcMax, 'bpm', 'fc') : '',
      ])}
      ${tout_.premiere ? `<p class="periode">Du ${RBT.fmtDateLong(tout_.premiere)} au ${RBT.fmtDateLong(tout_.derniere)}.</p>` : ''}
    </section>` +
    blocRepos();
}

function tout() { rendRecup(); rendPlan(); rendFiltre(); rendu(); }

/* Vrai quand un message de retour Strava occupe le bandeau. Il doit survivre
   au rendu normal : sans ce verrou, le bandeau('aucun') declenche des que le
   serveur repond effaçait le message d'erreur avant qu'on ait pu le lire. */
let stravaFige = false;
function bandeau(etat, quand) {
  if (stravaFige) return;
  if (etat === 'aucun') { els.fraicheur.innerHTML = ''; return; }
  const maj = quand
    ? `<span class="maj">${new Date(quand).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>`
    : '';
  if (etat === 'charge') {
    els.fraicheur.innerHTML = `<div class="frais"><span class="pouls"></span>
      Chiffres de ta dernière visite — le serveur se réveille, ça prend jusqu'à 30 secondes.${maj}</div>`;
  } else if (etat === 'vieux') {
    els.fraicheur.innerHTML = `<div class="frais pb"><span class="pouls" style="background:var(--amber);animation:none"></span>
      Le serveur n'a pas répondu. Voici les chiffres de ta dernière visite.${maj}</div>`;
  }
}

function videPour(titre, texte) {
  els.recup.innerHTML = '';
  els.plan.innerHTML = '';
  els.filtre.innerHTML = '';
  els.content.innerHTML = '';
  els.emptyState.style.display = 'block';
  els.emptyState.innerHTML = `<h2>${titre}</h2><p>${texte}</p>`;
}

/* Retour de connexion Strava. Le backend renvoie sur FRONTEND_URL avec
   ?connected=true ou ?strava_error=... — via la redirection de l'ancienne
   adresse tant que cette variable n'a pas ete changee sur Render. Sans ce
   traitement, une connexion refusee laissait l'utilisateur devant une page
   qui dit simplement "non connecte", sans expliquer pourquoi. */
function retourStrava() {
  const q = new URLSearchParams(location.search);
  const err = q.get('strava_error');
  const ok = q.get('connected');
  if (!err && !ok) return;
  // on nettoie l'adresse pour qu'un rechargement ne rejoue pas le message
  history.replaceState(null, '', location.pathname);
  stravaFige = true;
  if (err) {
    // une erreur reste affichée : elle demande une action
    els.fraicheur.innerHTML = `<div class="frais pb">
      <span class="pouls" style="background:var(--amber);animation:none"></span>
      Strava a refusé la connexion (${RBT.escapeHtml(err)}). Réessaie avec « Se connecter à Strava ».</div>`;
  } else {
    els.fraicheur.innerHTML = `<div class="frais">
      <span class="pouls" style="background:var(--moss);animation:none"></span>
      Compte Strava connecté. Les sorties arrivent.</div>`;
    setTimeout(() => { stravaFige = false; els.fraicheur.innerHTML = ''; }, 6000);
  }
}

// --- Démarrage -------------------------------------------------------------
async function init() {
  lirePlan();
  retourStrava();
  // 1. le cache, tout de suite : la page n'est jamais vide à l'ouverture
  const cache = lireCache();
  if (cache && cache.sorties && cache.sorties.length) {
    BRUT = cache.sorties;
    SORTIES = corrige(BRUT);
    ATHLETE = cache.athlete;
    tout();
    if (ATHLETE) els.statusText.textContent = `${ATHLETE.firstname} ${ATHLETE.lastname}`;
    bandeau('charge', cache.calcule);
  } else {
    els.content.innerHTML = '<div class="loading-msg">Premier chargement — le serveur se réveille, ça peut prendre 30 secondes.</div>';
  }

  // 2. les vrais chiffres, quand le serveur veut bien répondre
  try {
    const [connecte] = await Promise.all([RBT.loadAll(), chargerEntrainement()]);
    if (!connecte) {
      bandeau('aucun');
      els.statusText.textContent = 'Non connecté';
      els.connectBtn.style.display = 'inline-block';
      videPour('Pas encore connecté', 'Connecte ton compte Strava pour voir tes données.');
      return;
    }
    els.statusDot.classList.remove('off');
    els.statusText.textContent = `Connecté — ${RBT.state.athlete.firstname} ${RBT.state.athlete.lastname}`;

    BRUT = projette();
    SORTIES = corrige(BRUT);
    ATHLETE = RBT.state.athlete;
    if (!SORTIES.length) {
      bandeau('aucun');
      videPour('Aucune activité', 'Clique sur Sync pour récupérer tes données Strava.');
      return;
    }
    els.emptyState.style.display = 'none';
    tout();
    ecrireCache({ sorties: BRUT, athlete: ATHLETE });
    bandeau('aucun');
  } catch (err) {
    // Le serveur n'a pas répondu : on garde ce qui est affiché, et on le dit.
    if (SORTIES.length) {
      bandeau('vieux', cache && cache.calcule);
    } else {
      bandeau('aucun');
      videPour('Serveur injoignable', 'Il s\'endort après 15 minutes sans visite et met jusqu\'à 30 secondes à revenir. Réessaie avec Sync.');
    }
    els.statusText.textContent = 'Serveur injoignable';
  }
}

els.connectBtn.addEventListener('click', () => { window.location.href = `${API_BASE}/auth/strava`; });

els.syncBtn.addEventListener('click', async () => {
  els.syncBtn.disabled = true;
  els.syncBtn.textContent = 'Sync…';
  try {
    await RBT.sync();
    await RBT.loadAll();
    BRUT = projette();
    SORTIES = corrige(BRUT);
    ATHLETE = RBT.state.athlete;
    els.emptyState.style.display = 'none';
    tout();
    ecrireCache({ sorties: BRUT, athlete: ATHLETE });
    bandeau('aucun');
  } catch (err) {
    alert('Le serveur n\'a pas répondu. Il met parfois 30 secondes à se réveiller — réessaie.');
  }
  els.syncBtn.disabled = false;
  els.syncBtn.textContent = 'Sync';
});

init();
</script>
</body>
</html>
